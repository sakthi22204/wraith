[pytest]
testpaths = tests
# Several tests here probe juice_shop, which is a container on the compose
# network rather than something a host-side run can reach. Marking them means
# `pytest -m "not integration"` is a real fast subset instead of a set of
# connection errors, and it makes the dependency visible in the test file
# rather than only in whatever the output happened to say.
# On a host, the MCP SDK is not installed and tests/conftest.py skips the whole
# directory rather than reporting ten import errors. The suite is meant to be
# run in the container: `scripts/run_tests.sh sandbox`.
markers =
    integration: needs live infrastructure (juice_shop on the compose network). Excluded by `-m "not integration"`; see scripts/run_tests.sh.
