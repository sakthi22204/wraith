[crypto]
pubkey = /home/wraith/.jwt_tool/jwttool_custom_public_RSA.pem
privkey = /home/wraith/.jwt_tool/jwttool_custom_private_RSA.pem
ecpubkey = /home/wraith/.jwt_tool/jwttool_custom_public_EC.pem
ecprivkey = /home/wraith/.jwt_tool/jwttool_custom_private_EC.pem
jwks = /home/wraith/.jwt_tool/jwttool_custom_jwks.json

[customising]
useragent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) jwt_tool
jwks_kid = jwt_tool

[services]
jwt_tool_version = 2.3.0
proxy = 127.0.0.1:8080
redir = True
jwksloc =
jwksdynamic =
httplistener =

[input]
wordlist = jwt-common.txt
commonHeaders = common-headers.txt
commonPayloads = common-payloads.txt

[argvals]
sigType =
targetUrl =
rate = 999999999
cookies =
key =
keyList =
keyFile =
headerLoc =
payloadclaim =
headerclaim =
payloadvalue =
headervalue =
canaryvalue =
header =
exploitType =
scanMode =
reqMode =
postData =
resCode =
resSize =
resContent =
