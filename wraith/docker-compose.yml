version: '3.8'

services:
  graph_db:
    image: neo4j:5-community
    networks:
      - wraith_internal
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph_api:
    build:
      context: ./graph_db
    networks:
      - wraith_internal
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=bolt://graph_db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - NEO4J_DATABASE=neo4j
    depends_on:
      graph_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  recon_orchestrator:
    build:
      context: ./recon_orchestrator
    networks:
      - wraith_internal
    ports:
      - "8002:8002"
    environment:
      - GRAPH_DB_URL=http://graph_api:8001/api/v1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      graph_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHASE 3 — KALI SANDBOX
  kali_sandbox:
    build:
      context: ./kali_sandbox
    environment:
      - MSF_DATABASE_CONFIG=/opt/msf/config/database.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - wraith_internal

  # LOCAL TEST TARGETS — NEVER EXPOSE PUBLICLY, INTERNAL NETWORK ONLY
  juice_shop:
    image: bkimminich/juice-shop
    networks:
      - wraith_internal
    # No ports exposed to host for safety

networks:
  wraith_internal:
    driver: bridge

volumes:
  neo4j_data:
