version: '3.8'

services:
  graph_db:
    image: neo4j:5-community
    networks:
      - wraith_internal
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph_api:
    build:
      context: ./graph_db
    networks:
      - wraith_internal
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=bolt://graph_db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - NEO4J_DATABASE=neo4j
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
    depends_on:
      graph_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  recon_orchestrator:
    build:
      context: ./recon_orchestrator
    networks:
      - wraith_internal
    ports:
      - "8002:8002"
    environment:
      - GRAPH_DB_URL=http://graph_api:8001/api/v1
      - DOCKER_BROKER_URL=http://docker_broker:8005/api/v1
      - DOCKER_BROKER_TOKEN=${DOCKER_BROKER_TOKEN:-dev-token-change-me}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
    depends_on:
      graph_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  exploit_agent:
    build:
      context: ./exploit_agent
    ports:
      - "8003:8003"
    environment:
      - GRAPH_DB_URL=http://graph_api:8001/api/v1
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-claude-3-5-sonnet-20240620}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - MCP_SERVER_URLS=["http://kali_sandbox:8000"]
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
    networks:
      - wraith_internal
    depends_on:
      graph_api:
        condition: service_healthy
      kali_sandbox:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  active_exploit_runner:
    build:
      context: ./active_exploit_runner
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://wraith:password@postgres:5432/wraith_audit
      - REDIS_URL=redis://redis:6379/0
      - KALI_SANDBOX_URL=http://kali_sandbox:8000
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
      - DOCKER_BROKER_TOKEN=${DOCKER_BROKER_TOKEN:-dev-token-change-me}
    networks:
      - wraith_internal
    depends_on:
      - postgres
      - redis
      - kali_sandbox

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=wraith
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=wraith_audit
    networks:
      - wraith_internal
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    networks:
      - wraith_internal

  docker_broker:
    build:
      context: ./docker_broker
    ports:
      - "8005:8005"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - wraith_internal
    environment:
      - DOCKER_BROKER_TOKEN=${DOCKER_BROKER_TOKEN:-dev-token-change-me}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHASE 3 — KALI SANDBOX
  kali_sandbox:
    build:
      context: ./kali_sandbox
    environment:
      - MSF_DATABASE_CONFIG=/opt/msf/config/database.yml
    networks:
      - wraith_internal

  # OPTIONAL LOCAL LLM
  ollama:
    image: ollama/ollama
    profiles:
      - local-llm
    networks:
      - wraith_internal
    volumes:
      - ollama_data:/root/.ollama

  # PHASE 9 — REPORTING SERVICE
  reporting:
    build:
      context: ./reporting
    ports:
      - "8006:8006"
    environment:
      - GRAPH_DB_URL=http://graph_api:8001
      - ACTIVE_EXPLOIT_RUNNER_URL=http://active_exploit_runner:8004
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
    networks:
      - wraith_internal
    depends_on:
      graph_api:
        condition: service_healthy

  # PHASE 7/10 — FRONTEND CONTROL PANEL
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_GRAPH_DB_URL=http://localhost:8001
        - NEXT_PUBLIC_AGENT_URL=http://localhost:8003
        - NEXT_PUBLIC_RECON_URL=http://localhost:8002
        - NEXT_PUBLIC_EXPLOIT_RUNNER_URL=http://localhost:8004
        - NEXT_PUBLIC_REPORTING_URL=http://localhost:8006
    ports:
      - "3000:3000"
    networks:
      - wraith_internal
    depends_on:
      graph_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LOCAL TEST TARGETS — NEVER EXPOSE PUBLICLY, INTERNAL NETWORK ONLY
  juice_shop:
    image: bkimminich/juice-shop
    networks:
      - wraith_internal
    # No ports exposed to host for safety

networks:
  wraith_internal:
    driver: bridge

volumes:
  neo4j_data:
  postgres_audit_data:
  ollama_data:
