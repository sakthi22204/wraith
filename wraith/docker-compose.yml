version: '3.8'

services:
  graph_db:
    image: neo4j:5-community
    networks:
      - wraith_internal
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --timeout=5 http://localhost:7474/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  graph_api:
    build:
      context: ./graph_db
    networks:
      - wraith_internal
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=bolt://graph_db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - NEO4J_DATABASE=neo4j
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
    depends_on:
      graph_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  recon_orchestrator:
    build:
      context: ./recon_orchestrator
    networks:
      - wraith_internal
    ports:
      - "8002:8002"
    environment:
      - GRAPH_DB_URL=http://graph_api:8001/api/v1
      - DOCKER_BROKER_URL=http://docker_broker:8005/api/v1
      - RECON_BROKER_TOKEN=${RECON_BROKER_TOKEN:-dev-recon-token}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
      - RECON_DOCKER_NETWORK=${RECON_DOCKER_NETWORK:-wraith_wraith_internal}
      # Optional egress interception. Leave empty (default) to run all recon
      # tools unproxied — behaviour is byte-identical. When set to the proxy
      # service URL, supported tools (katana/httpx) route HTTP(S) through it
      # and trust its CA so the orchestrator persists decrypted evidence.
      - RECON_PROXY_URL=${RECON_PROXY_URL:-}
    depends_on:
      graph_api:
        condition: service_healthy
      docker_broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  exploit_agent:
    build:
      context: ./exploit_agent
    ports:
      - "8003:8003"
    environment:
      - GRAPH_DB_URL=http://graph_api:8001/api/v1
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-claude-3-5-sonnet-20240620}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-300}
      - INTERPRET_LLM_PROVIDER=${INTERPRET_LLM_PROVIDER:-}
      - INTERPRET_LLM_MODEL=${INTERPRET_LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - MCP_SERVER_URLS=["http://kali_sandbox:8000/sse"]
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
    networks:
      - wraith_internal
    depends_on:
      graph_api:
        condition: service_healthy
      kali_sandbox:
        condition: service_healthy
      # The agent's killswitch check hits active_exploit_runner, and
      # run_passive_recon posts to recon_orchestrator. If either is missing the
      # agent fails closed with an opaque "Name or service not known", so gate
      # startup on both being healthy.
      active_exploit_runner:
        condition: service_healthy
      recon_orchestrator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  active_exploit_runner:
    build:
      context: ./active_exploit_runner
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://wraith:password@postgres:5432/wraith_audit
      - REDIS_URL=redis://redis:6379/0
      - KALI_SANDBOX_URL=http://kali_sandbox:8000
      - GRAPH_DB_URL=http://graph_api:8001
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
      - EXPLOIT_RUNNER_BROKER_TOKEN=${EXPLOIT_RUNNER_BROKER_TOKEN:-dev-exploit-token}
      # Shared with kali_sandbox. The runner signs each approved request with
      # it; the sandbox refuses anything without a valid signature.
      - WRAITH_GATE_SECRET=${WRAITH_GATE_SECRET:-wraith-dev-gate-secret}
    networks:
      - wraith_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kali_sandbox:
        condition: service_healthy
      graph_api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=wraith
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=wraith_audit
    networks:
      - wraith_internal
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wraith -d wraith_audit"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - wraith_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  docker_broker:
    build:
      context: ./docker_broker
    ports:
      - "8005:8005"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - wraith_internal
    environment:
      - RECON_BROKER_TOKEN=${RECON_BROKER_TOKEN:-dev-recon-token}
      - EXPLOIT_RUNNER_BROKER_TOKEN=${EXPLOIT_RUNNER_BROKER_TOKEN:-dev-exploit-token}
      - RECON_DOCKER_NETWORK=${RECON_DOCKER_NETWORK:-wraith_wraith_internal}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHASE 3 — KALI SANDBOX
  kali_sandbox:
    build:
      context: ./kali_sandbox
    environment:
      - MSF_DATABASE_CONFIG=/opt/msf/config/database.yml
      # The sandbox verifies the runner's grant signature, and independently
      # re-reads the killswitch and scope rules before it sends anything.
      - WRAITH_GATE_SECRET=${WRAITH_GATE_SECRET:-wraith-dev-gate-secret}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://wraith:password@postgres:5432/wraith_audit
    networks:
      - wraith_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 2 http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # OPTIONAL LOCAL LLM
  ollama:
    build:
      context: ./ollama
    profiles:
      - local-llm
    cpuset: ${OLLAMA_CPUSET:-0-4}
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_CONTEXT_LENGTH=8192
    networks:
      - wraith_internal
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # PHASE 9 — REPORTING SERVICE
  reporting:
    build:
      context: ./reporting
    ports:
      - "8006:8006"
    environment:
      - GRAPH_DB_URL=http://graph_api:8001/api/v1
      - ACTIVE_EXPLOIT_RUNNER_URL=http://active_exploit_runner:8004/api/v1
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
    networks:
      - wraith_internal
    depends_on:
      graph_api:
        condition: service_healthy

  # ASSESSMENT SERVICE
  assessment_service:
    build:
      context: ./assessment_service
    ports:
      - "8007:8007"
    environment:
      - GRAPH_DB_URL=http://graph_api:8001/api/v1
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
    networks:
      - wraith_internal
    depends_on:
      graph_api:
        condition: service_healthy

  # PHASE 7/10 — FRONTEND CONTROL PANEL
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_GRAPH_DB_URL=http://localhost:8001
        - NEXT_PUBLIC_AGENT_URL=http://localhost:8003
        - NEXT_PUBLIC_RECON_URL=http://localhost:8002
        - NEXT_PUBLIC_EXPLOIT_RUNNER_URL=http://localhost:8004
        - NEXT_PUBLIC_REPORTING_URL=http://localhost:8006
        - NEXT_PUBLIC_ASSESSMENT_URL=http://localhost:8007
    environment:
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-dev-token-change-me}
      - GRAPH_DB_URL=http://graph_api:8001/api/v1
      - EXPLOIT_RUNNER_URL=http://active_exploit_runner:8004/api/v1
      - REPORTING_URL=http://reporting:8006/api/v1
    ports:
      - "3000:3000"
    networks:
      - wraith_internal
    depends_on:
      graph_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LOCAL TEST TARGETS — NEVER EXPOSE PUBLICLY, INTERNAL NETWORK ONLY
  juice_shop:
    image: bkimminich/juice-shop
    networks:
      - wraith_internal
    environment:
      - NODE_OPTIONS=--max-old-space-size=5120
    mem_limit: 6g
    restart: on-failure

  # Local Custom Recon Tool Images
  kiterunner_image:
    build:
      context: ./recon_orchestrator/tool_images/kiterunner
    image: kiterunner:latest

  linkfinder_image:
    build:
      context: ./recon_orchestrator/tool_images/linkfinder
    image: linkfinder:latest

  secretfinder_image:
    build:
      context: ./recon_orchestrator/tool_images/secretfinder
    image: secretfinder:latest

  gittools_image:
    build:
      context: ./recon_orchestrator/tool_images/gittools
    image: gittools:latest

  ffuf_image:
    build:
      context: ./recon_orchestrator/tool_images/ffuf
    image: ffuf/ffuf:latest

  gau_image:
    build:
      context: ./recon_orchestrator/tool_images/gau
    image: gau:latest

  waybackurls_image:
    build:
      context: ./recon_orchestrator/tool_images/waybackurls
    image: waybackurls:latest

  cloud_enum_image:
    build:
      context: ./recon_orchestrator/tool_images/cloud_enum
    image: cloud_enum:latest

  # Upstream ProjectDiscovery images used by the passive recon path.
  # recon_orchestrator/app/tools/{subfinder,naabu}.py declare these images
  # directly, so the broker runs them as-is. Declaring them here pre-pulls on
  # `docker compose up` — otherwise the first scan pays the pull inside the
  # tool timeout, which is how these tools ended up reported as failures.
  # These pull-and-exit like the other *_image services above.
  subfinder_image:
    image: projectdiscovery/subfinder:latest
    pull_policy: missing
    networks:
      - wraith_internal
    command: ["-h"]

  naabu_image:
    image: projectdiscovery/naabu:latest
    pull_policy: missing
    networks:
      - wraith_internal
    command: ["-h"]

  # Intercepting egress sidecar. OPT-IN via compose profile
  #   docker compose --profile recon-proxy up -d
  # so a plain `docker compose up` never starts it — byte-identical footprint.
  # RECON_PROXY_URL on the orchestrator points tool containers at this sidecar
  # (http://mitmproxy_sidecar:8080); its CA named-volume is mounted read-only into
  # tool containers so decrypted request/response evidence lands in the flow
  # file while keeping every tool's command/volumes byte-identical by default.
  # One-shot root init for the sidecar's named volumes.
  # mitmproxy's entrypoint drops privileges to uid 1000 ('mitmproxy'), but Docker
  # creates fresh named volumes owned by root:root 0755, so on a first
  # `up` mitmdump cannot write its CA or its --save-stream-file target and dies
  # with "Errno 13 Permission denied: /flows/flows.mitm" (and generates no CA,
  # leaving tool containers with nothing to trust). Chown both volumes to the
  # runtime uid before the sidecar starts. Idempotent, so it is safe to re-run
  # on every up; the sidecar itself still runs unprivileged.
  mitmproxy_volumes_init:
    image: busybox:latest
    profiles: ["recon-proxy"]
    networks:
      - wraith_internal
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - |
        chown -R 1000:1000 /ca /flows
        chmod -R u+rwX /ca /flows
        echo 'mitmproxy volumes ready'
    volumes:
      - mitmproxy_ca:/ca
      - mitmproxy_flows:/flows
    restart: "no"

  mitmproxy_sidecar:
    image: mitmproxy/mitmproxy:latest
    profiles: ["recon-proxy"]
    networks:
      - wraith_internal
    depends_on:
      mitmproxy_volumes_init:
        condition: service_completed_successfully
    command: mitmdump --listen-host 0.0.0.0 --listen-port 8080 --set ssl_insecure --save-stream-file /flows/flows.mitm
    volumes:
      - mitmproxy_ca:/home/mitmproxy/.mitmproxy
      - mitmproxy_flows:/flows
    # No published ports on purpose: only the internal network reaches it.

networks:
  wraith_internal:
    driver: bridge

volumes:
  neo4j_data:
  postgres_audit_data:
  ollama_data:
  mitmproxy_ca:
  mitmproxy_flows:
